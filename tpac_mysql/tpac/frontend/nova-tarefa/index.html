<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova tarefa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Nova tarefa</h1>
    <p class="apoio">Preencha os dados da tarefa.</p>

    <form id="formulario" novalidate>
      <div class="campo">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" required>
      </div>
      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" required>
          <option value="">Selecione</option>
          <option value="tarefas_diarias">Rotina diária</option>
          <option value="tarefas_educacionais">Estudos</option>
        </select>
      </div>
      <button type="submit">Criar tarefa</button>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="../api.js"></script>
  <script src="script.js"></script>
<a class="edu-back" href="?k=pjp-fq2mrAE">← Minhas aulas</a></body>
</html>
